[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hookcut"
version = "0.1.0"
description = "Turn long videos into viral Shorts, Reels & TikToks with local open models. Free, private, no cloud."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "hookcut contributors" }]
keywords = ["video", "shorts", "reels", "tiktok", "clips", "ai", "whisper", "ollama", "llm", "captions", "video-editing", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Ships OpenCV (cv2) as well, which the reframe stage uses for frame reading.
  "mediapipe>=0.10.14",
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hookcut = "hookcut.cli:app"

[project.urls]
Homepage = "https://github.com/abhay-error/hookcut"

[tool.hatch.build.targets.wheel]
packages = ["src/hookcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B008: typer.Option() in defaults is typer's documented idiom.
ignore = ["B008"]
