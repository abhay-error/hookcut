<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookcut</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b75; --line: #e4e2dc;
    --accent: #e8542f; --accent-ink: #ffffff; --good: #1f8a4c; --bad: #c0392b; --bar: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1b1b1f; --ink: #ececf0; --muted: #9a9aa6; --line: #2c2c33;
      --accent: #ff6a43; --accent-ink: #121214; --good: #4cc27f; --bad: #ff6b5b; --bar: #26262c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  form.new { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 10px; padding: 10px 12px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
  button.link:hover { color: var(--ink); }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 14px; align-items: center; }
  .opts label { display: flex; gap: 6px; align-items: center; }
  .opts select, .opts input[type=number] { padding: 5px 8px; }
  .opts input[type=number] { width: 64px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; }
  .job { padding: 14px 18px; margin-bottom: 10px; }
  .job-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .job-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status.failed { color: var(--bad); } .status.done { color: var(--good); }
  .bar { height: 6px; background: var(--bar); border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .msg { font-size: 13px; color: var(--muted); }
  .err { font-size: 13px; color: var(--bad); white-space: pre-wrap; margin-top: 6px; }
  .actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
  .clip { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .clip video { width: 100%; aspect-ratio: 9 / 16; background: #000; display: block; }
  .clip .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .clip .score { font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1; }
  .clip .score small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .clip .t { font-weight: 600; }
  .clip .why { font-size: 13px; color: var(--muted); flex: 1; }
  .clip a { color: var(--ink); font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 28px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
           width: min(520px, calc(100vw - 32px)); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .field { display: grid; gap: 4px; margin-bottom: 14px; }
  .field span { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  @media (max-width: 640px) { form.new { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>hook<span>cut</span></h1>
    <button class="link" id="open-settings">Settings</button>
  </header>
  <p class="sub">Paste a long video. Get the best moments as vertical clips, made on your computer with open models.</p>

  <section class="panel">
    <form class="new" id="new-job">
      <input id="target" placeholder="https://www.youtube.com/watch?v=…  or  /path/to/video.mp4" required autocomplete="off">
      <select id="model" title="Model that picks the clips"></select>
      <button class="primary" type="submit">Make clips</button>
    </form>
    <div class="opts">
      <label>Clips <input type="number" id="max-clips" min="1" max="20" value="5"></label>
      <label><input type="checkbox" id="captions" checked> Captions</label>
      <label><input type="checkbox" id="think"> Let the model think (slower, sharper)</label>
      <span id="server-note"></span>
    </div>
  </section>

  <h2>Jobs</h2>
  <div id="jobs"><div class="empty panel">No jobs yet. Paste a link above to start.</div></div>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h3 style="margin-top:0">Settings</h3>
    <label class="field"><span>Model server</span>
      <select name="llm.backend"><option value="ollama">Ollama</option><option value="openai">OpenAI-compatible (LM Studio, llama.cpp…)</option></select></label>
    <label class="field"><span>Server address</span><input name="llm.base_url"></label>
    <label class="field"><span>Context window (tokens)</span><input name="llm.num_ctx" type="number" min="2048" step="1024"></label>
    <label class="field"><span>Whisper model</span>
      <select name="whisper.model">
        <option>tiny</option><option>base</option><option>small</option><option>medium</option>
        <option>large-v3</option><option>large-v3-turbo</option></select></label>
    <label class="field"><span>Clip length (seconds, min – max)</span>
      <span style="display:flex;gap:8px"><input name="clips.min_seconds" type="number" min="5" style="flex:1"><input name="clips.max_seconds" type="number" min="10" style="flex:1"></span></label>
    <label class="field"><span>Caption style</span>
      <select name="render.caption_style"><option value="highlight">Highlight the spoken word</option><option value="plain">Plain</option></select></label>
    <label class="field"><span>YouTube cookies from browser (fixes "sign in to confirm you're not a bot")</span>
      <select name="cookies_from_browser"><option value="">None</option><option>chrome</option><option>firefox</option><option>edge</option><option>brave</option><option>safari</option></select></label>
    <div class="row"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="save">Save</button></div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const api = async (path, opts = {}) => {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let settings = null;
let rendered = {};

async function loadSettings() {
  const data = await api('/api/settings');
  settings = data.settings;
  const sel = $('#model');
  const models = data.models.includes(settings.llm.model) ? data.models : [settings.llm.model, ...data.models];
  sel.innerHTML = models.map((m) => `<option ${m === settings.llm.model ? 'selected' : ''}>${esc(m)}</option>`).join('');
  $('#max-clips').value = settings.clips.max_clips;
  $('#captions').checked = settings.render.captions;
  $('#think').checked = settings.llm.think;
  $('#server-note').textContent = data.models.length ? '' :
    `⚠ Can't reach the model server at ${settings.llm.base_url}. Is Ollama running?`;
  for (const el of $('#settings-form').elements) {
    if (!el.name) continue;
    const [a, b] = el.name.split('.');
    el.value = b ? settings[a][b] : settings[a];
  }
}

$('#open-settings').onclick = () => $('#settings').showModal();
$('#settings').addEventListener('close', async () => {
  if ($('#settings').returnValue !== 'save') return loadSettings();
  const patch = {};
  for (const el of $('#settings-form').elements) {
    if (!el.name) continue;
    const [a, b] = el.name.split('.');
    const v = el.type === 'number' ? Number(el.value) : el.value;
    if (b) (patch[a] ??= {})[b] = v; else patch[a] = v;
  }
  try { await api('/api/settings', { method: 'PUT', body: JSON.stringify(patch) }); }
  catch (e) { alert(e.message); }
  loadSettings();
});

$('#new-job').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/jobs', { method: 'POST', body: JSON.stringify({
      target: $('#target').value, model: $('#model').value,
      max_clips: Number($('#max-clips').value), captions: $('#captions').checked, think: $('#think').checked,
    }) });
    $('#target').value = '';
    refresh();
  } catch (err) { alert(err.message); }
};

function jobHTML(j) {
  const pct = Math.round(j.progress * 100);
  const active = j.status === 'running' || j.status === 'queued';
  const label = { queued: 'Waiting', running: `${pct}%`, done: 'Done', failed: 'Failed', cancelled: 'Cancelled' }[j.status];
  const clips = j.clips.map((c) => `
    <div class="clip">
      <video src="/api/jobs/${j.id}/clips/${c.index}" controls preload="metadata" playsinline></video>
      <div class="body">
        <div class="score">${c.highlight.score}<small>/100 · ${Math.round(c.highlight.end - c.highlight.start)}s</small></div>
        <div class="t">${esc(c.highlight.title)}</div>
        <div class="why">${esc(c.highlight.reason)}</div>
        <a href="/api/jobs/${j.id}/clips/${c.index}?download=true">Download</a>
      </div>
    </div>`).join('');
  return `
    <div class="job panel" id="job-${j.id}">
      <div class="job-top">
        <div class="job-title" title="${esc(j.target)}">${esc(j.title || j.target)}</div>
        <div class="status ${j.status}">${label}</div>
      </div>
      ${active ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ''}
      <div class="msg">${esc(j.message)}</div>
      ${j.error ? `<div class="err">${esc(j.error)}</div>` : ''}
      <div class="actions">
        ${active ? `<button class="link" data-cancel="${j.id}">Cancel</button>` : ''}
        ${j.clips.length ? `<button class="link" data-open="${j.id}">Open folder</button>` : ''}
        ${!active ? `<button class="link" data-retry="${esc(j.target)}">Run again</button>
                     <button class="link" data-delete="${j.id}">Delete</button>` : ''}
      </div>
      ${clips ? `<div class="clips">${clips}</div>` : ''}
    </div>`;
}

async function refresh() {
  let jobs;
  try { jobs = await api('/api/jobs'); } catch { return; }
  const box = $('#jobs');
  if (!jobs.length) { box.innerHTML = '<div class="empty panel">No jobs yet. Paste a link above to start.</div>'; rendered = {}; return; }
  // Re-render only jobs whose state changed, so playing videos aren't interrupted.
  const next = {};
  const frag = [];
  for (const j of jobs) {
    const key = JSON.stringify([j.status, j.progress, j.message, j.error, j.clips.length, j.title]);
    next[j.id] = key;
    const existing = document.getElementById(`job-${j.id}`);
    if (existing && rendered[j.id] === key) { frag.push(existing); continue; }
    const tmp = document.createElement('div'); tmp.innerHTML = jobHTML(j);
    frag.push(tmp.firstElementChild);
  }
  box.replaceChildren(...frag);
  rendered = next;
}

$('#jobs').addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  try {
    if (t.dataset.cancel) await api(`/api/jobs/${t.dataset.cancel}/cancel`, { method: 'POST' });
    if (t.dataset.open) await api(`/api/jobs/${t.dataset.open}/open`, { method: 'POST' });
    if (t.dataset.retry) { $('#target').value = t.dataset.retry; $('#target').focus(); }
    if (t.dataset.delete && confirm('Delete this job and its clips?')) await api(`/api/jobs/${t.dataset.delete}`, { method: 'DELETE' });
  } catch (err) { alert(err.message); }
  refresh();
});

loadSettings().catch((e) => { $('#server-note').textContent = e.message; });
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
